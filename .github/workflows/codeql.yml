# Analyse de sécurité du code par GitHub (CodeQL) : XSS, injections, redirections ouvertes, secrets…
# dans le frontend TypeScript et dans les workflows GitHub Actions.
# Les alertes apparaissent dans l'onglet Security → Code scanning du dépôt.
# (CodeQL ne sait pas analyser PHP : le backend est couvert par ses tests d'attaque dans la CI.)

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1' # chaque lundi : de nouvelles règles sortent régulièrement

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
