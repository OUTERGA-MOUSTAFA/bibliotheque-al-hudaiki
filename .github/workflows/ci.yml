# Intégration continue : chaque push et chaque pull request sont vérifiés avant d'arriver en production.
#
#   backend   → tests PHPUnit sur un vrai PostgreSQL 18 (même version que Neon) + audit des dépendances
#   frontend  → lint, types TypeScript, build Next.js + audit des dépendances
#   docker    → l'image de production (Railway) se construit sans erreur
#   secrets   → aucun mot de passe ni clé API n'a été commité par erreur
#
# Déploiement (CD) : Railway et Vercel déploient la branche main automatiquement.
# Railway attend que ce workflow soit vert (réglage « Wait for CI ») — voir le README, section CI/CD.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Un nouveau push annule la vérification en cours de la même branche (inutile de vérifier un ancien état)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # Le nom DOIT finir par « _test » : tests/TestCase.php refuse toute autre base
          POSTGRES_DB: al_hudaiki_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d al_hudaiki_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: ci
      DB_PASSWORD: ci
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, zip, mbstring, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (PHPUnit sur PostgreSQL 18)
        run: php artisan test

      - name: Dépendances sans faille connue
        run: composer audit

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Pas d'API pendant le build CI : les pages se construisent avec des listes vides
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (TypeScript)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Dépendances sans faille grave
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Image Docker du backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: al-hudaiki-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Pas de secret dans le code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Analyse les fichiers du dépôt (pas l'historique : d'anciens secrets déjà changés y restent visibles)
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner --exit-code 1
